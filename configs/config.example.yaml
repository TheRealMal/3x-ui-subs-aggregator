# 3X-UI Subs Aggregator Configuration

server:
  port: 8080
  admin_secret: "change-me-to-a-strong-secret"
  profile_title: "My VPN" # Subscription profile name shown in HApp/Shadowrocket
  tls:
    # Optional: domain name for auto-discovering certs in /root/cert/<domain>/
    domain: ""
    # Optional: explicit paths override auto-discovery. Both must be set together.
    cert_file: ""
    key_file: ""
    # Auto-discovery order (when no explicit paths):
    #   1. /root/cert/<domain>/{fullchain.pem,privkey.pem|cert.pem,key.pem|fullchain.cer,privkey.key}
    #   2. /root/cert/ip/<ip>/{same patterns}

# Both 3X-UI generations are supported; the version is detected per panel:
#   v3+ : clients are first-class rows, and session logins must carry a CSRF token
#   v2  : clients live inside each inbound's settings blob
panels:
  - name: "server-1"
    address: "https://panel1.example.com" # scheme and host only, no port or trailing slash
    username: "admin"
    password: "admin"
    api_port: 2053       # Port for panel API (login, inbounds, client management)
    sub_port: 443        # Port for subscription endpoint
    base_path: "/panel/" # Panel base path (starts and ends with /), used for API calls
    sub_path: "/sub/"    # Sub URI Path from 3X-UI panel settings (starts and ends with /)
  - name: "server-2"
    address: "https://panel2.example.com"
    # 3X-UI v3+ only: Bearer token from Settings -> Security -> API Token.
    # Preferred for a long-running service — it replaces username/password,
    # never expires like a session, and bypasses CSRF entirely.
    # When set, username and password may be omitted.
    api_token: "your-api-token"
    api_port: 2053
    sub_port: 443
    base_path: "/another-admin/"
    sub_path: "/sub/"

log:
  level: "info"
